server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

  # Same-origin API proxy: the browser only ever talks to this host, so cookies need no CORS.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /docs { proxy_pass http://backend:8000; }
  location = /openapi.json { proxy_pass http://backend:8000/api/v1/openapi.json; }

  # Hashed build assets can be cached forever; the HTML shell must not be.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
