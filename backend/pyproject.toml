[project]
name = "shiptrack-backend"
version = "1.0.0"
description = "ShipTrack API: issue tracking with an AI bug-report assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = [
  # Starlette's TestClient prefers the new httpx2 package; httpx still works fine for now.
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["B008"]  # FastAPI uses Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "S105", "S106", "S107"]
"app/tests/conftest.py" = ["I001"]
"app/scripts/*" = ["S105"]

[tool.ruff.lint.isort]
# The local ./alembic migrations folder shares its name with the Alembic library.
known-third-party = ["alembic"]
